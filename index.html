<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>MyChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e6ecf0;
            --panel: #ffffff;
            --ink: #16212b;
            --muted: #6b7a88;
            --line: #e3e9ee;
            --accent: #0e7c86;
            --accent-dark: #0a5f67;
            --accent-soft: #e2f3f4;
            --bubble-in: #ffffff;
            --bubble-out: #0e7c86;
            --badge: #f08a24;
            --danger: #c7372f;
            --radius: 14px;
        }

        body.dark {
            --bg: #121212;
            --panel: #1e1e1e;
            --ink: #e8eaed;
            --muted: #9ca3af;
            --line: #333333;
            --accent: #00d4ff;
            --accent-dark: #00b8d4;
            --accent-soft: #1a3d42;
            --bubble-in: #2d2d2d;
            --bubble-out: #00d4ff;
            --badge: #ff6b35;
            --danger: #ff6b6b;
        }

        body.auto {
            color-scheme: light dark;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: "Onest", "Segoe UI", system-ui, sans-serif;
            background: var(--bg);
            color: var(--ink);
            font-size: 15px;
            transition: background 0.3s, color 0.3s;
        }

        button, input, textarea { font: inherit; color: inherit; }
        button { cursor: pointer; border: none; background: none; }
        textarea { resize: vertical; }
        .hidden { display: none !important; }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .btn {
            padding: 10px 16px;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-weight: 500;
            transition: background .15s;
        }
        .btn:hover { background: var(--accent-dark); }
        .btn:disabled { opacity: .55; cursor: default; }
        .btn-ghost { background: var(--accent-soft); color: var(--accent-dark); }
        .btn-ghost:hover { background: var(--accent-soft); opacity: .8; }
        .btn-wide { width: 100%; }
        .btn-sm { padding: 6px 12px; font-size: 14px; }
        .btn-icon { width: 40px; height: 40px; padding: 0; border-radius: 50%; display: grid; place-items: center; }

        .field {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--panel);
            margin-bottom: 10px;
        }
        .field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

        .error { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
        .hint { color: var(--muted); font-size: 12.5px; line-height: 1.4; margin-bottom: 12px; }

        .avatar {
            flex: none;
            width: 44px; height: 44px;
            border-radius: 50%;
            display: grid; place-items: center;
            color: #fff; font-weight: 600; font-size: 18px;
            user-select: none;
        }
        .avatar.sm { width: 32px; height: 32px; font-size: 14px; }
        .avatar.lg { width: 80px; height: 80px; font-size: 32px; }

        #auth {
            height: 100%;
            display: grid; place-items: center;
            padding: 16px;
        }
        .auth-card {
            width: 100%; max-width: 380px;
            background: var(--panel);
            border-radius: 18px;
            padding: 28px 26px 22px;
            box-shadow: 0 10px 40px rgba(22, 33, 43, .1);
        }
        .auth-card h1 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
        .auth-card .sub { color: var(--muted); margin-bottom: 18px; }
        .auth-card .btn + .btn { margin-top: 8px; }

        #app {
            height: 100%;
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            background: var(--panel);
        }
        @media (min-width: 1000px) {
            #app { height: calc(100% - 32px); margin-top: 16px; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 40px rgba(22, 33, 43, .1); }
        }

        .sidebar {
            width: 340px; flex: none;
            display: flex; flex-direction: column;
            border-right: 1px solid var(--line);
            min-height: 0;
        }

        .me-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
        }
        .me-card {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-radius: 8px;
            padding: 6px;
            transition: background 0.2s;
        }
        .me-card:hover { background: var(--accent-soft); }
        .me-info { flex: 1; min-width: 0; }
        .me-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .me-status { font-size: 12px; color: var(--muted); }
        .link-btn { color: var(--muted); font-size: 13px; padding: 6px 8px; border-radius: 8px; }
        .link-btn:hover { background: var(--bg); color: var(--ink); }

        .search-wrap { padding: 12px 14px; }
        .search-wrap input { width: 100%; }
        .add-wrap { padding: 12px 14px; }

        #chat-list { flex: 1; overflow-y: auto; min-height: 0; }
        .chat-row {
            display: flex; gap: 12px; align-items: center;
            width: 100%; text-align: left;
            padding: 10px 14px;
        }
        .chat-row:hover { background: #f5f8fa; }
        .chat-row.active { background: var(--accent-soft); }
        .chat-row .mid { flex: 1; min-width: 0; }
        .chat-row .top { display: flex; justify-content: space-between; gap: 8px; }
        .chat-row .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-row .time { color: var(--muted); font-size: 12px; flex: none; }
        .chat-row .bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 2px; }
        .chat-row .preview { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-row .preview.typing { color: var(--accent); }
        .badge {
            flex: none; min-width: 20px; height: 20px; padding: 0 6px;
            border-radius: 10px; background: var(--badge); color: #fff;
            font-size: 12px; font-weight: 600; display: grid; place-items: center;
        }
        .empty-list { padding: 28px 20px; color: var(--muted); text-align: center; line-height: 1.5; }

        .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
        .pane-empty { flex: 1; display: grid; place-items: center; color: var(--muted); padding: 20px; text-align: center; }
        .chat-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }

        .chat-head {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; background: var(--panel);
            border-bottom: 1px solid var(--line);
        }
        .chat-head .info { flex: 1; min-width: 0; text-align: left; }
        .chat-head .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-head .status { font-size: 13px; color: var(--muted); }
        .chat-head .status.typing { color: var(--accent); }
        .back-btn { display: none; font-size: 22px; padding: 4px 8px; color: var(--accent); }

        #messages {
            flex: 1; overflow-y: auto; min-height: 0;
            padding: 14px 14px 6px;
            display: flex; flex-direction: column; gap: 3px;
        }
        .msg {
            display: flex; align-items: flex-end; gap: 8px; max-width: 78%;
            position: relative;
        }
        .msg.out { align-self: flex-end; flex-direction: row-reverse; }
        .msg.gap { margin-top: 9px; }
        .msg .avatar-slot { width: 32px; flex: none; }
        .bubble {
            background: var(--bubble-in);
            padding: 7px 11px 6px;
            border-radius: var(--radius);
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 1px rgba(22, 33, 43, .06);
            word-break: break-word; white-space: pre-wrap;
            min-width: 0;
            position: relative;
        }
        .msg.out .bubble {
            background: var(--bubble-out); color: #fff;
            border-bottom-left-radius: var(--radius); border-bottom-right-radius: 4px;
        }
        .bubble .author { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 1px; }
        .bubble .replied-to {
            display: block;
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 4px;
            padding-bottom: 4px;
            border-left: 2px solid var(--accent);
            padding-left: 8px;
        }
        .bubble .time { float: right; margin: 6px 0 0 12px; font-size: 11px; opacity: .6; line-height: 1; }
        .bubble img { max-width: 200px; border-radius: 8px; margin-top: 6px; display: block; }
        .no-msgs { margin: auto; color: var(--muted); }
        .msg.pending .bubble { opacity: .65; }
        .msg.failed .bubble { background: var(--danger); color: #fff; cursor: pointer; }
        .msg.failed .bubble .time { opacity: .9; }
        .msg.deleted .bubble { opacity: 0.5; font-style: italic; }

        .message-menu {
            display: none;
            position: absolute;
            bottom: 100%;
            right: 0;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(22, 33, 43, .15);
            z-index: 5;
            flex-direction: column;
            min-width: 140px;
        }
        .message-menu button {
            padding: 8px 12px;
            text-align: left;
            font-size: 13px;
            transition: background 0.2s;
            border-radius: 0;
            color: var(--ink);
        }
        .message-menu button:first-child { border-radius: 8px 8px 0 0; }
        .message-menu button:last-child { border-radius: 0 0 8px 8px; }
        .message-menu button:hover { background: var(--accent-soft); }

        .composer {
            display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
            background: var(--panel); border-top: 1px solid var(--line);
        }
        .composer .field { margin: 0; flex: 1; border-radius: 22px; padding: 11px 16px; }
        .composer .btn { border-radius: 22px; padding: 0 20px; }
        .composer .icon-btn { padding: 8px 12px; color: var(--muted); font-size: 18px; }
        .composer .icon-btn:hover { color: var(--accent); }

        .overlay {
            position: fixed; inset: 0; background: rgba(22, 33, 43, .45);
            display: grid; place-items: center; padding: 16px; z-index: 10;
        }
        .modal {
            width: 100%; max-width: 400px; max-height: 88vh; overflow-y: auto;
            background: var(--panel); border-radius: 18px; padding: 22px;
        }
        .modal h3 { font-size: 18px; margin-bottom: 14px; }
        .modal h4 { font-size: 14px; margin-top: 16px; margin-bottom: 10px; font-weight: 600; }
        .modal .row-btn {
            display: block; width: 100%; text-align: left;
            padding: 14px; border-radius: 12px; background: var(--bg); margin-bottom: 10px;
        }
        .modal .row-btn:hover { background: var(--accent-soft); }
        .modal .row-btn b { display: block; margin-bottom: 2px; }
        .modal .row-btn span { color: var(--muted); font-size: 13px; }
        .modal .actions { display: flex; gap: 8px; margin-top: 6px; }
        .modal .actions .btn { flex: 1; }

        .pick-list { max-height: 240px; overflow-y: auto; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 10px; }
        .pick {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 10px; cursor: pointer;
        }
        .pick:hover { background: var(--accent-soft); }
        .pick input { width: 18px; height: 18px; accent-color: var(--accent); }

        .member-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }

        #settings-menu {
            position: fixed;
            right: -400px;
            top: 0;
            width: 350px;
            height: 100%;
            background: var(--panel);
            border-left: 1px solid var(--line);
            overflow-y: auto;
            transition: right 0.3s;
            z-index: 20;
            padding: 16px;
        }
        #settings-menu.open { right: 0; }
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .settings-header h2 { font-size: 18px; }
        .settings-section { margin-bottom: 20px; }
        .settings-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--muted); }
        .radio-group { display: flex; flex-direction: column; gap: 8px; }
        .radio-group label {
            display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px; border-radius: 6px; transition: background 0.2s;
        }
        .radio-group label:hover { background: var(--accent-soft); }
        .radio-group input { width: 16px; height: 16px; }

        .profile-section { text-align: center; }
        .profile-avatar-big { margin: 0 auto 12px; display: block; width: 80px; height: 80px; }
        .profile-avatar-big-img {
            display: none; width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 0 auto 12px;
        }
        .avatar-upload-label {
            display: inline-block; margin-bottom: 12px; font-size: 12px; color: var(--accent); cursor: pointer; text-decoration: underline;
        }
        .avatar-upload-label:hover { opacity: 0.7; }
        #avatar-upload { display: none; }

        @media (max-width: 760px) {
            html, body { position: fixed; inset: 0; width: 100%; overflow: hidden; }
            #app, #auth { height: var(--app-h, 100%); }
            #auth { overflow-y: auto; }
            .chat-head { position: sticky; top: 0; z-index: 2; flex: none; }
            .composer { flex: none; }
            .sidebar { width: 100%; border-right: none; }
            .pane { display: none; }
            #app.chat-open .sidebar { display: none; }
            #app.chat-open .pane { display: flex; }
            .back-btn { display: block; }
            .msg { max-width: 88%; }
            #settings-menu { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>

<div id="auth">
    <div class="auth-card">
        <h1>MyChat</h1>
        <p class="sub" id="auth-subtitle">Войдите или создайте аккаунт</p>
        <div id="auth-error" class="error"></div>
        <input class="field" type="text" id="auth-login" placeholder="Логин" autocomplete="username" maxlength="20">
        <input class="field" type="password" id="auth-pas" placeholder="Пароль" autocomplete="current-password" maxlength="64">
        <p class="hint" id="auth-hint">Логин: 3–20 символов, латиница, цифры и «_». Пароль: от 6 символов, минимум одна буква и одна цифра</p>
        <button class="btn btn-wide" id="btn-login">Войти</button>
        <button class="btn btn-ghost btn-wide" id="btn-register">Зарегистрироваться</button>
    </div>
</div>

<div id="app" class="hidden">
    <aside class="sidebar">
        <div class="me-bar">
            <div class="me-card" id="me-card">
                <div class="avatar sm" id="me-avatar"></div>
                <div class="me-info">
                    <div class="me-name" id="me-name"></div>
                    <div class="me-status" id="me-status"></div>
                </div>
            </div>
            <button class="link-btn" id="btn-settings">⚙️</button>
        </div>

        <div class="search-wrap">
            <input class="field" type="text" id="chat-search" placeholder="Поиск..." maxlength="50">
        </div>

        <div class="add-wrap">
            <button class="btn btn-wide" id="btn-add-chat">Добавить чат</button>
        </div>
        <div id="chat-list"></div>
    </aside>

    <section class="pane">
        <div class="pane-empty" id="pane-empty">Выберите чат слева или добавьте новый</div>
        <div class="chat-view hidden" id="chat-view">
            <div class="chat-head">
                <button class="back-btn" id="btn-back" aria-label="Назад к списку чатов">‹</button>
                <div class="avatar" id="head-avatar"></div>
                <button class="info" id="head-info">
                    <div class="title" id="head-title"></div>
                    <div class="status" id="head-status"></div>
                </button>
            </div>
            <div id="messages"></div>
            <div class="composer">
                <input class="field" type="text" id="message-text" placeholder="Сообщение" maxlength="2000" autocomplete="off">
                <button class="icon-btn" id="btn-emoji" title="Эмодзи">😀</button>
                <button class="icon-btn" id="btn-photo" title="Фото">📷</button>
                <button class="btn" id="btn-send">Отправить</button>
            </div>
        </div>
    </section>
</div>

<div id="settings-menu" class="hidden">
    <div class="settings-header">
        <h2>Настройки</h2>
        <button class="link-btn" id="settings-close">✕</button>
    </div>

    <div class="settings-section profile-section">
        <div class="avatar lg" id="profile-avatar-big"></div>
        <img id="profile-avatar-big-img" alt="Avatar">
        <label class="avatar-upload-label">
            Загрузить аватарку
            <input type="file" id="avatar-upload" accept="image/*">
        </label>
        <input class="field" type="text" id="profile-name" placeholder="Имя" maxlength="50">
        <textarea class="field" id="profile-bio" placeholder="Описание" maxlength="150" style="min-height: 60px;"></textarea>
        <button class="btn btn-wide" id="save-profile">Сохранить профиль</button>
    </div>

    <div class="settings-section">
        <h3>Тема</h3>
        <div class="radio-group">
            <label><input type="radio" name="theme" value="light"> ☀️ Светлая</label>
            <label><input type="radio" name="theme" value="dark"> 🌙 Темная</label>
            <label><input type="radio" name="theme" value="auto"> 🖥️ Система</label>
        </div>
    </div>

    <div class="settings-section">
        <h3>Язык</h3>
        <div class="radio-group">
            <label><input type="radio" name="language" value="ru"> 🇷🇺 Русский</label>
            <label><input type="radio" name="language" value="en"> 🇬🇧 English</label>
            <label><input type="radio" name="language" value="ua"> 🇺🇦 Українська</label>
        </div>
    </div>

    <button class="btn btn-wide btn-ghost" id="btn-logout">Выйти</button>
</div>

<div id="modal-root"></div>

<script src="script.js"></script>
</body>
</html>
